version: '3.8'

services:
  database:
    image: timescale/timescaledb:2.19.3-pg14
    container_name: weather-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"
    restart: unless-stopped

  collector:
    build: ./collector
    container_name: weather-collector
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      LOCATION_LAT: ${LOCATION_LAT}
      LOCATION_LON: ${LOCATION_LON}
      COLLECTION_INTERVAL: ${COLLECTION_INTERVAL}
      DATA_DIR: ${DATA_DIR}
    volumes:
      - ./weather_data:/data
    depends_on:
      - database
    restart: unless-stopped
    
  web:
    build:
      context: ${WEB_CONTEXT}
      dockerfile: Dockerfile
    container_name: weather-web
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${WEB_SERVER_PORT}:${WEB_SERVER_PORT}"
    volumes:
      - ./weather_data:/data:ro
    depends_on:
      database:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  db_data:
    driver: local
  weather_data:
    driver: local